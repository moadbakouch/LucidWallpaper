name: LucidWallpaper
options:
  bundleIdPrefix: com.lucidwallpaper
  deploymentTarget:
    macOS: "14.0"
  createIntermediateGroups: true
  developmentLanguage: en

settings:
  base:
    SWIFT_VERSION: "5.0"
    ARCHS: arm64
    ONLY_ACTIVE_ARCH: YES
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    CODE_SIGN_IDENTITY: "-"          # ad-hoc signing for local development
    CODE_SIGN_STYLE: Manual
    DEVELOPMENT_TEAM: ""
    ENABLE_HARDENED_RUNTIME: NO       # enabled only for notarized release builds (M8)

targets:
  LucidWallpaper:
    type: application
    platform: macOS
    sources:
      - path: Sources
      # Web-wallpaper runtime shared with the screen saver (package scheme, Mac shims).
      - path: Shared
      - path: Resources/AppIcon.icns
        buildPhase: resources
      # Folder reference: copied verbatim into Contents/Resources/BundledWallpapers,
      # preserving each wallpaper's directory layout (index.html + assets).
      - path: BundledWallpapers
        type: folder
        buildPhase: resources
    settings:
      base:
        PRODUCT_NAME: LucidWallpaper
        PRODUCT_BUNDLE_IDENTIFIER: com.lucidwallpaper.app
        INFOPLIST_FILE: Resources/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        CODE_SIGN_ENTITLEMENTS: Resources/LucidWallpaper.entitlements
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
    # Build the screensaver alongside the app (so it can be installed from Settings).
    dependencies:
      - target: LucidWallpaperSaver
        link: false
        embed: false
      # Siri / Shortcuts integration (App Intents). Linking it triggers Xcode's AppIntents
      # metadata extraction so the actions appear in the Shortcuts app automatically.
      - sdk: AppIntents.framework
    postBuildScripts:
      # Copy the built .saver into the app bundle so Settings can install it for the user.
      - name: Embed screen saver
        basedOnDependencyAnalysis: false
        script: |
          SAVER="$BUILT_PRODUCTS_DIR/LucidWallpaperSaver.saver"
          DEST="$CODESIGNING_FOLDER_PATH/Contents/Resources"
          if [ -d "$SAVER" ]; then
            rm -rf "$DEST/LucidWallpaperSaver.saver"
            /bin/cp -R "$SAVER" "$DEST/"
          fi
      # iCloud Documents sync stamps files with com.apple.FinderInfo / fileprovider
      # xattrs that make codesign fail ("resource fork … not allowed"). Strip them from
      # the bundle right before Xcode's implicit signing step.
      - name: Strip extended attributes before signing
        basedOnDependencyAnalysis: false
        script: /usr/bin/xattr -cr "$CODESIGNING_FOLDER_PATH" || true

  # Companion screensaver (.saver). Built with its own scheme; not a dependency of the app.
  LucidWallpaperSaver:
    type: bundle
    platform: macOS
    sources:
      - path: Saver
        excludes:
          - "Info.plist"
      - path: Shared
    settings:
      base:
        PRODUCT_NAME: LucidWallpaperSaver
        PRODUCT_BUNDLE_IDENTIFIER: com.lucidwallpaper.saver
        INFOPLIST_FILE: Saver/Info.plist
        GENERATE_INFOPLIST_FILE: NO
        WRAPPER_EXTENSION: saver
        SKIP_INSTALL: YES
        LD_RUNPATH_SEARCH_PATHS:
          - "$(inherited)"
          - "@executable_path/../Frameworks"
          - "@loader_path/../Frameworks"
    dependencies:
      - sdk: ScreenSaver.framework
      - sdk: AVFoundation.framework
      - sdk: WebKit.framework
      - sdk: Metal.framework
      - sdk: QuartzCore.framework
      - sdk: UniformTypeIdentifiers.framework
    postBuildScripts:
      - name: Strip extended attributes before signing
        basedOnDependencyAnalysis: false
        script: /usr/bin/xattr -cr "$CODESIGNING_FOLDER_PATH" || true
