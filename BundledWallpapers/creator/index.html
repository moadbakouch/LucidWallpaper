<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Lucid Wallpaper Creation</title>
<!--
  Lucid Wallpaper Creator engine. Every knob is a Lively property, so a wallpaper made in the
  Creator is a normal Lively package: its settings show up in the inspector and it runs in the
  screensaver and in Lively itself. Initial values come from config.js (written by the Creator,
  loaded synchronously so the first frame is already right - thumbnails rely on that); later
  changes arrive through livelyPropertyListener / lucidCreatorApply.
-->
<style>
  html, body { margin: 0; width: 100%; height: 100%; overflow: hidden; background: #000; }
  #stage { position: fixed; inset: 0; overflow: hidden; }
  #bg { position: absolute; inset: -48px; will-change: transform; }
  #bg > * { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; display: none; }
  #grad { image-rendering: auto; }
  #dim { position: absolute; inset: 0; background: #000; pointer-events: none; }
  #fx { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; }
  #text { position: absolute; inset: 0; display: flex; padding: 7vmin 8vmin; box-sizing: border-box;
          pointer-events: none; color: #fff; }
  #card { display: flex; flex-direction: column; gap: 0.35em; line-height: 1.05; }
  #card.glass { padding: 0.55em 0.8em; border-radius: 0.45em; background: rgba(255,255,255,0.12);
                border: 1px solid rgba(255,255,255,0.22); text-shadow: 0 1px 12px rgba(0,0,0,0.35);
                -webkit-backdrop-filter: blur(24px) saturate(160%) brightness(0.9);
                backdrop-filter: blur(24px) saturate(160%) brightness(0.9); box-shadow: 0 20px 60px rgba(0,0,0,0.25); }
  #card.shadow { text-shadow: 0 2px 18px rgba(0,0,0,0.45), 0 1px 3px rgba(0,0,0,0.35); }
  #clock { font-variant-numeric: tabular-nums; letter-spacing: -0.02em; }
  #clock .sec { opacity: 0.55; font-size: 0.45em; margin-left: 0.18em; letter-spacing: 0; }
  #clock .ampm { opacity: 0.7; font-size: 0.32em; margin-left: 0.2em; letter-spacing: 0.04em; }
  #date { font-size: 0.24em; opacity: 0.85; letter-spacing: 0.02em; }
  #custom { font-size: 0.26em; opacity: 0.92; white-space: pre-wrap; }
  #clock:empty, #date:empty, #custom:empty { display: none; }
</style>
</head>
<body>
<div id="stage">
  <div id="bg">
    <canvas id="grad" width="192" height="120"></canvas>
    <img id="img" alt="">
    <video id="vid" muted loop playsinline autoplay></video>
  </div>
  <div id="dim"></div>
  <canvas id="fx"></canvas>
  <div id="text"><div id="card"><div id="clock"></div><div id="date"></div><div id="custom"></div></div></div>
</div>
<script src="config.js"></script>
<script>
(function () {
  'use strict';

  // ---------- configuration ----------
  var DEFAULTS = {
    bgType: 0, gradientStyle: 0, color1: '#0B1026', color2: '#5B2A86', color3: '#1FA2A8',
    bgImage: '', bgVideo: '', kenBurns: false, bgBlur: 0, bgDim: 10, parallax: 12,
    effect: 3, effectColor: '#FFFFFF', effectDensity: 100, effectSpeed: 1, effectSize: 1, mouseReact: true,
    showClock: true, clock24: false, showSeconds: false, showDate: true, customText: '',
    font: 0, textColor: '#FFFFFF', textSize: 14, textPosition: 0, textStyle: 1
  };
  var cfg = {};
  var k;
  for (k in DEFAULTS) cfg[k] = DEFAULTS[k];
  var initial = window.LUCID_CONFIG || {};
  for (k in initial) cfg[k] = initial[k];

  var EFFECTS = ['none', 'snow', 'rain', 'stars', 'fireflies', 'bubbles', 'sakura', 'constellation', 'matrix', 'bokeh'];
  var FONTS = [
    { family: '-apple-system, system-ui, "Helvetica Neue", sans-serif', weight: 600 },
    { family: 'ui-rounded, "SF Pro Rounded", -apple-system, system-ui, sans-serif', weight: 600 },
    { family: 'ui-serif, "New York", Georgia, serif', weight: 500 },
    { family: 'ui-monospace, "SF Mono", Menlo, monospace', weight: 500 },
    { family: '-apple-system, system-ui, "Helvetica Neue", sans-serif', weight: 200 }
  ];
  // [justify-content, align-items, text-align]
  var POSITIONS = [
    ['center', 'center', 'center'], ['flex-start', 'flex-start', 'left'], ['center', 'flex-start', 'center'],
    ['flex-end', 'flex-start', 'right'], ['flex-start', 'flex-end', 'left'], ['center', 'flex-end', 'center'],
    ['flex-end', 'flex-end', 'right']
  ];

  var $ = function (id) { return document.getElementById(id); };
  var bg = $('bg'), grad = $('grad'), img = $('img'), vid = $('vid'), dim = $('dim');
  var fx = $('fx'), textBox = $('text'), card = $('card'), clockEl = $('clock'), dateEl = $('date'), customEl = $('custom');
  var g = grad.getContext('2d');
  var ctx = fx.getContext('2d');

  function num(v, d) { v = Number(v); return isFinite(v) ? v : d; }
  function bool(v) { return v === true || v === 'true' || v === 1; }
  function hexToRgb(h) {
    h = String(h || '#ffffff').replace('#', '');
    if (h.length === 3) h = h[0] + h[0] + h[1] + h[1] + h[2] + h[2];
    var n = parseInt(h.slice(0, 6), 16) || 0;
    return [(n >> 16) & 255, (n >> 8) & 255, n & 255];
  }
  function rgba(rgb, a) { return 'rgba(' + rgb[0] + ',' + rgb[1] + ',' + rgb[2] + ',' + a + ')'; }
  function mediaPath(v) { return String(v || '').replace(/\\/g, '/'); }

  // ---------- layout / sizing ----------
  var W = 0, H = 0, DPR = 1;
  function resize() {
    DPR = Math.min(window.devicePixelRatio || 1, 2);
    W = window.innerWidth; H = window.innerHeight;
    fx.width = Math.max(1, Math.round(W * DPR)); fx.height = Math.max(1, Math.round(H * DPR));
    ctx.setTransform(DPR, 0, 0, DPR, 0, 0);
    buildParticles();
  }

  // ---------- background ----------
  // A photo/video that is missing or can't be decoded falls back to the gradient, never black.
  var mediaFailed = {};
  img.addEventListener('error', function () { mediaFailed[img.getAttribute('src')] = 1; applyBackground(); });
  vid.addEventListener('error', function () { mediaFailed[vid.getAttribute('src')] = 1; applyBackground(); });
  function mediaUsable(v) { return !!v && !mediaFailed[mediaPath(v)]; }

  function applyBackground() {
    var type = num(cfg.bgType, 0);
    grad.style.display = (type === 0 || type === 1) ? 'block' : 'none';
    var wantImg = type === 2 && mediaUsable(cfg.bgImage), wantVid = type === 3 && mediaUsable(cfg.bgVideo);
    img.style.display = wantImg ? 'block' : 'none';
    vid.style.display = wantVid ? 'block' : 'none';
    if (wantImg) { var src = mediaPath(cfg.bgImage); if (img.getAttribute('src') !== src) img.setAttribute('src', src); }
    if (wantVid) {
      var vsrc = mediaPath(cfg.bgVideo);
      if (vid.getAttribute('src') !== vsrc) { vid.setAttribute('src', vsrc); }
      var p = vid.play(); if (p && p.catch) p.catch(function () {});
    } else if (!vid.paused) { vid.pause(); }
    // Photo/video picked but missing: fall back to the gradient rather than a black screen.
    if ((type === 2 && !wantImg) || (type === 3 && !wantVid)) grad.style.display = 'block';
    var blur = num(cfg.bgBlur, 0);
    bg.style.filter = blur > 0 ? 'blur(' + blur + 'px)' : 'none';
    dim.style.opacity = Math.max(0, Math.min(0.9, num(cfg.bgDim, 0) / 100));
    drawGradient(lastT);
  }

  function drawGradient(t) {
    var type = num(cfg.bgType, 0);
    var showGrad = grad.style.display !== 'none';
    if (!showGrad) return;
    var w = grad.width, h = grad.height;
    var c1 = hexToRgb(cfg.color1), c2 = hexToRgb(cfg.color2), c3 = hexToRgb(cfg.color3);
    if (type === 1) { g.fillStyle = rgba(c1, 1); g.fillRect(0, 0, w, h); return; }
    var style = num(cfg.gradientStyle, 0);
    var s = t * 0.00006 * num(cfg.effectSpeed, 1);
    if (style === 1) {
      var a = s * 2.2;
      var x = Math.cos(a) * w, y = Math.sin(a) * h;
      var lg = g.createLinearGradient(w / 2 - x, h / 2 - y, w / 2 + x, h / 2 + y);
      lg.addColorStop(0, rgba(c1, 1)); lg.addColorStop(0.5, rgba(c2, 1)); lg.addColorStop(1, rgba(c3, 1));
      g.fillStyle = lg; g.fillRect(0, 0, w, h); return;
    }
    if (style === 2) s = 0.7;   // still: a fixed, nicely composed frame of the flowing mesh
    g.fillStyle = rgba(c1, 1); g.fillRect(0, 0, w, h);
    var blobs = [
      [c2, 0.30 + 0.22 * Math.sin(s * 1.3), 0.35 + 0.25 * Math.cos(s * 1.7), 0.75],
      [c3, 0.70 + 0.20 * Math.cos(s * 1.1), 0.65 + 0.22 * Math.sin(s * 1.5), 0.70],
      [c2, 0.80 + 0.15 * Math.sin(s * 0.9 + 2), 0.20 + 0.18 * Math.cos(s * 1.2 + 1), 0.55],
      [c3, 0.18 + 0.15 * Math.cos(s * 1.4 + 3), 0.80 + 0.15 * Math.sin(s * 0.8 + 2), 0.50]
    ];
    for (var i = 0; i < blobs.length; i++) {
      var b = blobs[i], r = Math.max(w, h) * b[3];
      var rg = g.createRadialGradient(b[1] * w, b[2] * h, 0, b[1] * w, b[2] * h, r);
      rg.addColorStop(0, rgba(b[0], 0.85)); rg.addColorStop(1, rgba(b[0], 0));
      g.fillStyle = rg; g.fillRect(0, 0, w, h);
    }
  }

  // ---------- pointer + parallax ----------
  var mouse = { x: -1e4, y: -1e4, nx: 0.5, ny: 0.5, active: false };
  var px = 0, py = 0;
  function onMove(e) {
    mouse.x = e.clientX; mouse.y = e.clientY; mouse.active = true;
    mouse.nx = W ? e.clientX / W : 0.5; mouse.ny = H ? e.clientY / H : 0.5;
  }
  window.addEventListener('mousemove', onMove, { passive: true });
  window.addEventListener('pointermove', onMove, { passive: true });
  document.addEventListener('mouseleave', function () { mouse.active = false; mouse.x = mouse.y = -1e4; });

  function updateBackgroundTransform(t) {
    var amount = num(cfg.parallax, 0);
    var tx = amount > 0 ? (0.5 - mouse.nx) * amount * 2 : 0;
    var ty = amount > 0 ? (0.5 - mouse.ny) * amount * 2 : 0;
    px += (tx - px) * 0.06; py += (ty - py) * 0.06;
    var scale = 1;
    if (bool(cfg.kenBurns)) scale = 1.04 + 0.04 * Math.sin(t * 0.00005);
    bg.style.transform = 'translate3d(' + px.toFixed(2) + 'px,' + py.toFixed(2) + 'px,0) scale(' + scale.toFixed(4) + ')';
  }

  // ---------- effects ----------
  var parts = [];
  var columns = [];
  var GLYPHS = 'アイウエオカキクケコサシスセソタチツテトナニヌネノ0123456789ABCDEF<>*+=';
  function rand(a, b) { return a + Math.random() * (b - a); }

  function buildParticles() {
    var kind = EFFECTS[num(cfg.effect, 0)] || 'none';
    var density = Math.max(0.1, num(cfg.effectDensity, 100) / 100);
    var area = (W * H) / (1440 * 900);
    var base = { snow: 220, rain: 260, stars: 320, fireflies: 70, bubbles: 55, sakura: 70, constellation: 110, bokeh: 28 }[kind] || 0;
    var n = Math.min(1500, Math.round(base * density * Math.max(0.35, area)));
    parts = [];
    for (var i = 0; i < n; i++) parts.push(spawn(kind, true));
    columns = [];
    if (kind === 'matrix') {
      var size = 16 * num(cfg.effectSize, 1);
      var cols = Math.ceil(W / size);
      for (var c = 0; c < cols; c++) {
        if (Math.random() > Math.min(1, 0.55 * density)) continue;
        columns.push({ x: c * size, y: rand(-H, 0), speed: rand(0.6, 1.4), size: size });
      }
    }
  }

  function spawn(kind, anywhere) {
    var s = num(cfg.effectSize, 1);
    var p = { x: rand(0, W), y: anywhere ? rand(0, H) : -20, vx: 0, vy: 0, r: 1, a: 1, ph: rand(0, 6.283), rot: rand(0, 6.283), vr: 0, ox: 0, oy: 0 };
    switch (kind) {
      case 'snow': p.r = rand(0.8, 3.2) * s; p.vy = rand(0.35, 1.1) * (0.6 + p.r / 4); p.vx = rand(-0.2, 0.2); p.a = rand(0.45, 0.95); break;
      case 'rain': p.r = rand(10, 24) * s; p.vy = rand(9, 15); p.vx = 1.6; p.a = rand(0.15, 0.45); if (!anywhere) p.y = rand(-H * 0.2, 0); break;
      case 'stars': p.r = rand(0.3, 1.6) * s; p.a = rand(0.2, 1); p.tw = rand(0.0006, 0.0025); break;
      case 'fireflies': p.r = rand(1.2, 2.6) * s; p.vx = rand(-0.25, 0.25); p.vy = rand(-0.25, 0.25); p.tw = rand(0.001, 0.003); break;
      case 'bubbles': p.r = rand(6, 26) * s; p.vy = -rand(0.25, 0.9); p.y = anywhere ? rand(0, H) : H + p.r + 10; p.a = rand(0.25, 0.6); break;
      case 'sakura': p.r = rand(4, 8) * s; p.vy = rand(0.4, 1.0); p.vx = rand(0.2, 0.8); p.vr = rand(-0.02, 0.02); p.a = rand(0.6, 0.95); break;
      case 'constellation': p.r = rand(1, 2.2) * s; p.vx = rand(-0.25, 0.25); p.vy = rand(-0.25, 0.25); p.a = rand(0.5, 1); break;
      case 'bokeh': p.r = rand(30, 110) * s; p.vx = rand(-0.15, 0.15); p.vy = rand(-0.12, 0.12); p.a = rand(0.05, 0.16); break;
    }
    return p;
  }

  function repel(p, strength) {
    if (!bool(cfg.mouseReact) || !mouse.active) return;
    var dx = p.x - mouse.x, dy = p.y - mouse.y, d2 = dx * dx + dy * dy, R = 140;
    if (d2 < R * R && d2 > 0.01) {
      var d = Math.sqrt(d2), f = (1 - d / R) * strength;
      p.ox += (dx / d) * f; p.oy += (dy / d) * f;
    }
  }

  function drawEffects(t, dt) {
    ctx.clearRect(0, 0, W, H);
    var kind = EFFECTS[num(cfg.effect, 0)] || 'none';
    if (kind === 'none') return;
    var sp = num(cfg.effectSpeed, 1) * dt;
    var col = hexToRgb(cfg.effectColor);
    var i, p;
    if (kind === 'matrix') { drawMatrix(sp, col); return; }
    if (kind === 'constellation') { drawConstellation(sp, col); return; }
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      p.ox *= 0.92; p.oy *= 0.92;
      switch (kind) {
        case 'snow':
          repel(p, 2.2);
          p.y += p.vy * sp; p.x += (p.vx + Math.sin(t * 0.001 + p.ph) * 0.3) * sp + p.ox; p.y += p.oy;
          if (p.y > H + 10 || p.x < -20 || p.x > W + 20) { parts[i] = spawn(kind, false); continue; }
          ctx.fillStyle = rgba(col, p.a); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
          break;
        case 'rain':
          p.y += p.vy * sp; p.x += p.vx * sp;
          if (p.y > H + 30) { parts[i] = spawn(kind, false); continue; }
          ctx.strokeStyle = rgba(col, p.a); ctx.lineWidth = Math.max(0.6, num(cfg.effectSize, 1));
          ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(p.x - p.vx * 1.6, p.y - p.r); ctx.stroke();
          break;
        case 'stars':
          var tw = 0.55 + 0.45 * Math.sin(t * p.tw * num(cfg.effectSpeed, 1) + p.ph);
          ctx.fillStyle = rgba(col, p.a * tw); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
          break;
        case 'fireflies':
          repel(p, 1.4);
          p.vx += rand(-0.03, 0.03); p.vy += rand(-0.03, 0.03);
          p.vx = Math.max(-0.5, Math.min(0.5, p.vx)); p.vy = Math.max(-0.5, Math.min(0.5, p.vy));
          p.x += p.vx * sp + p.ox; p.y += p.vy * sp + p.oy;
          if (p.x < -10) p.x = W + 10; if (p.x > W + 10) p.x = -10; if (p.y < -10) p.y = H + 10; if (p.y > H + 10) p.y = -10;
          var glow = 0.35 + 0.65 * Math.max(0, Math.sin(t * p.tw + p.ph));
          var rg = ctx.createRadialGradient(p.x, p.y, 0, p.x, p.y, p.r * 7);
          rg.addColorStop(0, rgba(col, 0.9 * glow)); rg.addColorStop(0.25, rgba(col, 0.35 * glow)); rg.addColorStop(1, rgba(col, 0));
          ctx.fillStyle = rg; ctx.beginPath(); ctx.arc(p.x, p.y, p.r * 7, 0, 6.283); ctx.fill();
          break;
        case 'bubbles':
          repel(p, 2.5);
          p.y += p.vy * sp + p.oy; p.x += Math.sin(t * 0.0012 + p.ph) * 0.4 * sp + p.ox;
          if (p.y < -p.r - 20) { parts[i] = spawn(kind, false); continue; }
          ctx.strokeStyle = rgba(col, p.a); ctx.lineWidth = 1.2;
          ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.stroke();
          ctx.fillStyle = rgba(col, p.a * 0.12); ctx.fill();
          ctx.fillStyle = rgba(col, p.a * 0.9); ctx.beginPath(); ctx.arc(p.x - p.r * 0.35, p.y - p.r * 0.35, p.r * 0.14, 0, 6.283); ctx.fill();
          break;
        case 'sakura':
          repel(p, 2.0);
          p.y += p.vy * sp + p.oy; p.x += (p.vx + Math.sin(t * 0.0009 + p.ph) * 0.6) * sp + p.ox; p.rot += p.vr * sp;
          if (p.y > H + 20 || p.x > W + 20) { parts[i] = spawn(kind, false); parts[i].x = rand(-W * 0.3, W); continue; }
          ctx.save(); ctx.translate(p.x, p.y); ctx.rotate(p.rot); ctx.scale(1, 0.55 + 0.45 * Math.sin(t * 0.002 + p.ph));
          ctx.fillStyle = rgba(col, p.a); ctx.beginPath();
          ctx.moveTo(0, -p.r); ctx.bezierCurveTo(p.r, -p.r * 0.6, p.r * 0.8, p.r * 0.7, 0, p.r);
          ctx.bezierCurveTo(-p.r * 0.8, p.r * 0.7, -p.r, -p.r * 0.6, 0, -p.r); ctx.fill(); ctx.restore();
          break;
        case 'bokeh':
          repel(p, 0.8);
          p.x += p.vx * sp + p.ox; p.y += p.vy * sp + p.oy;
          if (p.x < -p.r) p.x = W + p.r; if (p.x > W + p.r) p.x = -p.r; if (p.y < -p.r) p.y = H + p.r; if (p.y > H + p.r) p.y = -p.r;
          var pulse = 0.7 + 0.3 * Math.sin(t * 0.0005 + p.ph);
          var bg2 = ctx.createRadialGradient(p.x, p.y, p.r * 0.2, p.x, p.y, p.r);
          bg2.addColorStop(0, rgba(col, p.a * pulse)); bg2.addColorStop(0.8, rgba(col, p.a * 0.7 * pulse)); bg2.addColorStop(1, rgba(col, 0));
          ctx.fillStyle = bg2; ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
          break;
      }
    }
  }

  function drawConstellation(sp, col) {
    var i, j, p, q, maxD = 140 * num(cfg.effectSize, 1), maxD2 = maxD * maxD;
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      p.x += p.vx * sp; p.y += p.vy * sp;
      if (p.x < 0 || p.x > W) p.vx *= -1;
      if (p.y < 0 || p.y > H) p.vy *= -1;
    }
    ctx.lineWidth = 0.8;
    for (i = 0; i < parts.length; i++) {
      p = parts[i];
      for (j = i + 1; j < parts.length; j++) {
        q = parts[j];
        var dx = p.x - q.x, dy = p.y - q.y, d2 = dx * dx + dy * dy;
        if (d2 < maxD2) { ctx.strokeStyle = rgba(col, 0.35 * (1 - d2 / maxD2)); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(q.x, q.y); ctx.stroke(); }
      }
      if (bool(cfg.mouseReact) && mouse.active) {
        var mx = p.x - mouse.x, my = p.y - mouse.y, m2 = mx * mx + my * my, R = maxD * 1.4;
        if (m2 < R * R) { ctx.strokeStyle = rgba(col, 0.6 * (1 - m2 / (R * R))); ctx.beginPath(); ctx.moveTo(p.x, p.y); ctx.lineTo(mouse.x, mouse.y); ctx.stroke(); }
      }
      ctx.fillStyle = rgba(col, p.a); ctx.beginPath(); ctx.arc(p.x, p.y, p.r, 0, 6.283); ctx.fill();
    }
  }

  function drawMatrix(sp, col) {
    for (var i = 0; i < columns.length; i++) {
      var c = columns[i], size = c.size;
      ctx.font = size + 'px ui-monospace, Menlo, monospace';
      c.y += c.speed * sp * size * 0.35;
      var trail = 18;
      for (var k = 0; k < trail; k++) {
        var y = c.y - k * size;
        if (y < -size || y > H + size) continue;
        var gi = Math.abs(Math.floor(y / size) * 7 + i * 13 + Math.floor(c.y / (size * 6))) % GLYPHS.length;
        var ch = GLYPHS.charAt(gi);
        ctx.fillStyle = k === 0 ? 'rgba(235,255,240,0.95)' : rgba(col, Math.max(0, 0.85 - k / trail));
        ctx.fillText(ch, c.x, y);
      }
      if (c.y - trail * size > H) { c.y = rand(-H * 0.5, 0); c.speed = rand(0.6, 1.4); }
    }
  }

  // ---------- text overlay ----------
  function pad(n) { return n < 10 ? '0' + n : '' + n; }
  var lastClockKey = '';
  function updateText(force) {
    var now = new Date();
    var showClock = bool(cfg.showClock), secs = bool(cfg.showSeconds), h24 = bool(cfg.clock24);
    var key = [showClock, secs, h24, bool(cfg.showDate), now.getHours(), now.getMinutes(), secs ? now.getSeconds() : 0, now.getDate()].join('|');
    if (!force && key === lastClockKey) return;
    lastClockKey = key;
    if (showClock) {
      var hh = now.getHours(), ampm = '';
      if (!h24) { ampm = hh >= 12 ? 'PM' : 'AM'; hh = hh % 12 || 12; }
      var html = (h24 ? pad(hh) : hh) + ':' + pad(now.getMinutes());
      if (secs) html += '<span class="sec">' + pad(now.getSeconds()) + '</span>';
      if (ampm) html += '<span class="ampm">' + ampm + '</span>';
      clockEl.innerHTML = html;
    } else clockEl.innerHTML = '';
    dateEl.textContent = bool(cfg.showDate)
      ? now.toLocaleDateString('en-US', { weekday: 'long', month: 'long', day: 'numeric' }) : '';
  }

  function applyText() {
    var f = FONTS[num(cfg.font, 0)] || FONTS[0];
    var pos = POSITIONS[num(cfg.textPosition, 0)] || POSITIONS[0];
    textBox.style.justifyContent = pos[0]; textBox.style.alignItems = pos[1];
    card.style.textAlign = pos[2];
    card.style.alignItems = pos[2] === 'left' ? 'flex-start' : pos[2] === 'right' ? 'flex-end' : 'center';
    card.style.fontFamily = f.family; card.style.fontWeight = f.weight;
    card.style.color = cfg.textColor || '#fff';
    card.style.fontSize = Math.max(2, num(cfg.textSize, 14)) + 'vmin';
    var style = num(cfg.textStyle, 1);
    card.className = style === 2 ? 'glass' : style === 1 ? 'shadow' : '';
    customEl.textContent = String(cfg.customText || '');
    var any = bool(cfg.showClock) || bool(cfg.showDate) || customEl.textContent.length > 0;
    textBox.style.display = any ? 'flex' : 'none';
    updateText(true);
  }

  // ---------- property plumbing ----------
  var REBUILD = { effect: 1, effectDensity: 1, effectSize: 1 };
  var BG = { bgType: 1, gradientStyle: 1, color1: 1, color2: 1, color3: 1, bgImage: 1, bgVideo: 1, bgBlur: 1, bgDim: 1, kenBurns: 1 };
  function set(name, value) {
    if (!(name in DEFAULTS)) return;
    cfg[name] = value;
    if (REBUILD[name]) buildParticles();
    if (BG[name]) applyBackground();
    applyText();
  }
  window.livelyPropertyListener = function (name, value) { set(name, value); };
  // Live preview from the Creator: apply a whole config, rebuilding only what changed (so dragging
  // a color or blur slider doesn't respawn every particle).
  window.lucidCreatorApply = function (obj) {
    var rebuild = false, background = false;
    for (var key in obj) {
      if (!(key in DEFAULTS) || cfg[key] === obj[key]) continue;
      cfg[key] = obj[key];
      if (REBUILD[key]) rebuild = true;
      if (BG[key]) background = true;
    }
    if (rebuild) buildParticles();
    if (background) applyBackground();
    applyText();
  };
  window.livelyWallpaperPlaybackChanged = function (data) {
    var paused = typeof data === 'object' && data ? !!data.IsPaused : !!data;
    if (vid.style.display !== 'none') { if (paused) vid.pause(); else { var p = vid.play(); if (p && p.catch) p.catch(function () {}); } }
  };

  // ---------- loop ----------
  var lastT = 0, prev = 0;
  function frame(t) {
    t = t || performance.now();
    var dt = prev ? Math.min(3, (t - prev) / 16.667) : 1;
    prev = t; lastT = t;
    // Only the animated gradient styles need redrawing; still/solid/photo fallback are drawn once.
    var type = num(cfg.bgType, 0), style = num(cfg.gradientStyle, 0);
    var fallback = (type === 2 && !mediaUsable(cfg.bgImage)) || (type === 3 && !mediaUsable(cfg.bgVideo));
    if ((type === 0 || fallback) && style !== 2) drawGradient(t);
    updateBackgroundTransform(t);
    drawEffects(t, dt);
    updateText(false);
    requestAnimationFrame(frame);
  }

  window.addEventListener('resize', resize);
  resize();
  applyBackground();
  applyText();
  // Paint the first frame synchronously (off-screen thumbnail renderers may never run rAF).
  frame(performance.now());
})();
</script>
</body>
</html>
