<!doctype html><html><head><meta charset="utf-8"><title>Dynamic Sky</title>
<style>html,body{margin:0;height:100%;overflow:hidden;background:#0b1020}canvas{display:block}</style>
</head><body><canvas id="c"></canvas><script>
const cv=document.getElementById('c'),ctx=cv.getContext('2d');
let W,H,DPR=Math.min(window.devicePixelRatio||1,2);
function resize(){W=cv.width=Math.floor(innerWidth*DPR);H=cv.height=Math.floor(innerHeight*DPR);cv.style.width=innerWidth+'px';cv.style.height=innerHeight+'px';build();}
addEventListener('resize',resize);

const P={weatherEffects:true,intensity:1.0,showSun:true,stars:true};
// Live environment (time/weather/theme), with a sensible local-time fallback.
let env={time:{dayFraction:localFrac(),isNight:localNight()},weather:{available:false},theme:{accent:'#5B8CFF',isDark:true}};
function localFrac(){const d=new Date();return (d.getHours()*3600+d.getMinutes()*60+d.getSeconds())/86400;}
function localNight(){const h=new Date().getHours();return h<6||h>=20;}
window.livelyEnvironment=function(e){ if(e&&e.time){env=e;} };
window.livelyPropertyListener=function(n,v){ if(n in P) P[n]=v; };

function hex(h){h=(h||'#88f').replace('#','');if(h.length===3)h=h.split('').map(c=>c+c).join('');return[parseInt(h.substr(0,2),16),parseInt(h.substr(2,2),16),parseInt(h.substr(4,2),16)];}
function lerp(a,b,t){return a+(b-a)*t;}
function mix(a,b,t){return[lerp(a[0],b[0],t),lerp(a[1],b[1],t),lerp(a[2],b[2],t)];}
function rgb(c){return 'rgb('+(c[0]|0)+','+(c[1]|0)+','+(c[2]|0)+')';}

// Sky color stops through the day (top color, bottom color), keyed by dayFraction.
const PALETTE=[
  {f:0.00,top:[6,8,20],   bot:[14,16,40]},    // deep night
  {f:0.22,top:[20,24,54], bot:[120,80,90]},   // pre-dawn
  {f:0.28,top:[70,110,180],bot:[240,150,110]},// sunrise
  {f:0.5, top:[70,140,225],bot:[175,210,240]},// noon
  {f:0.72,top:[60,90,170], bot:[245,150,90]}, // sunset
  {f:0.80,top:[24,26,60],  bot:[90,60,90]},   // dusk
  {f:1.00,top:[6,8,20],    bot:[14,16,40]},   // night
];
function skyColors(f){
  for(let i=0;i<PALETTE.length-1;i++){
    const a=PALETTE[i],b=PALETTE[i+1];
    if(f>=a.f&&f<=b.f){const t=(f-a.f)/(b.f-a.f);return {top:mix(a.top,b.top,t),bot:mix(a.bot,b.bot,t)};}
  }
  return {top:PALETTE[0].top,bot:PALETTE[0].bot};
}

let stars=[],clouds=[],drops=[];
function build(){
  stars=[];for(let i=0;i<220;i++)stars.push({x:Math.random()*W,y:Math.random()*H*0.7,r:Math.random()*1.4+0.3,p:Math.random()*6.28});
  clouds=[];for(let i=0;i<9;i++)clouds.push({x:Math.random()*W,y:H*(0.1+Math.random()*0.4),s:0.6+Math.random()*1.2,v:(0.2+Math.random()*0.5)});
  drops=[];for(let i=0;i<400;i++)drops.push({x:Math.random()*W,y:Math.random()*H,l:Math.random()*1});
}
resize();

let t=0;
function frame(){
  t+=0.016;
  const f=env.time?env.time.dayFraction:localFrac();
  const night=env.time?env.time.isNight:localNight();
  const wx=env.weather||{available:false};
  const sky=skyColors(f);
  const g=ctx.createLinearGradient(0,0,0,H);
  g.addColorStop(0,rgb(sky.top));g.addColorStop(1,rgb(sky.bot));
  ctx.fillStyle=g;ctx.fillRect(0,0,W,H);

  // Stars at night
  if(P.stars&&night){
    for(const s of stars){const tw=0.5+0.5*Math.sin(t*1.5+s.p);ctx.fillStyle='rgba(255,255,255,'+(tw*0.8)+')';ctx.beginPath();ctx.arc(s.x,s.y,s.r*DPR,0,7);ctx.fill();}
  }

  // Sun / moon arc
  if(P.showSun){
    const ang=(f-0.25)*6.28318;               // sunrise ~0.25 → rises east
    const cx=W*0.5+Math.sin(ang)*W*0.42, cy=H*0.62-Math.cos(ang)*H*0.5;
    const r=Math.min(W,H)*0.07;
    const sunUp=cy<H*0.95;
    if(sunUp){
      const acc=hex((env.theme&&env.theme.accent)||'#FFE08A');
      const col=night?[235,238,255]:[255,225,160];
      const glow=ctx.createRadialGradient(cx,cy,0,cx,cy,r*4);
      glow.addColorStop(0,'rgba('+col[0]+','+col[1]+','+col[2]+',0.5)');
      glow.addColorStop(1,'rgba('+col[0]+','+col[1]+','+col[2]+',0)');
      ctx.fillStyle=glow;ctx.beginPath();ctx.arc(cx,cy,r*4,0,7);ctx.fill();
      ctx.fillStyle=rgb(col);ctx.beginPath();ctx.arc(cx,cy,r,0,7);ctx.fill();
      if(night){ctx.fillStyle=rgb(sky.top);ctx.beginPath();ctx.arc(cx+r*0.4,cy-r*0.3,r*0.9,0,7);ctx.fill();} // moon crescent
    }
  }

  // Clouds (opacity from cloud cover, default light)
  const cover=wx.available?(wx.cloud||0)/100:0.35;
  for(const c of clouds){
    c.x+=c.v*DPR*P.intensity; if(c.x>W+200*DPR)c.x=-200*DPR;
    const a=0.10+cover*0.5;
    ctx.fillStyle='rgba(255,255,255,'+(night?a*0.4:a)+')';
    puff(c.x,c.y,60*c.s*DPR);
  }

  // Rain / snow
  if(P.weatherEffects&&wx.available&&(wx.isRaining||wx.isSnowing)){
    const snow=wx.isSnowing;
    for(const d of drops){
      if(snow){d.y+=1.3*DPR;d.x+=Math.sin(t+d.l*6)*0.6*DPR;ctx.fillStyle='rgba(255,255,255,0.8)';ctx.beginPath();ctx.arc(d.x,d.y,1.6*DPR,0,7);ctx.fill();}
      else{d.y+=10*DPR;ctx.strokeStyle='rgba(180,200,230,0.5)';ctx.lineWidth=DPR;ctx.beginPath();ctx.moveTo(d.x,d.y);ctx.lineTo(d.x-2*DPR,d.y+12*DPR);ctx.stroke();}
      if(d.y>H){d.y=-10;d.x=Math.random()*W;}
    }
  }
  requestAnimationFrame(frame);
}
function puff(x,y,r){ctx.beginPath();ctx.arc(x,y,r,0,7);ctx.arc(x+r,y+r*0.2,r*0.8,0,7);ctx.arc(x-r,y+r*0.2,r*0.7,0,7);ctx.arc(x+r*0.4,y-r*0.4,r*0.7,0,7);ctx.fill();}
frame();   // paint one full frame synchronously (so library thumbnails aren't blank), then loop
</script></body></html>
